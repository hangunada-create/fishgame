<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>생선 삼총사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="같은 생선 세 마리를 한 줄로 모으면 팡! 이상한생선가게 기억 게임 4탄">
<meta property="og:type" content="website">
<meta property="og:title" content="생선 삼총사 · 이상한생선가게 게임 4탄">
<meta property="og:description" content="같은 생선 세 마리를 한 줄로 모으면 팡! 60초 동안 얼마나 잡을 수 있을까?">
<meta property="og:image" content="https://hangunada-create.github.io/fishgame/4/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hangunada-create.github.io/fishgame/4/og.png">
<meta property="og:url" content="https://hangunada-create.github.io/fishgame/4/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 위에 점수·시간 판, 가운데 6x6 생선 보드, 아래에 오늘 잡은 생선 수. 2·3탄의 바다색을 이어받음 */
:root{
  --sea:#f2f6f9; --ink:#1d3557; --muted:#5b6b80; --wave:#3da9fc; --wave-deep:#1e88e5;
  --card:#ffffff; --line:#d6e3ee; --coral:#ff7a59; --shadow:rgba(29,53,87,.14);
  --board:#dcebf7;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0e1a26;--ink:#e6eef6;--muted:#9fb2c6;--wave:#4fb3ff;--wave-deep:#7cc6ff;
  --card:#f7fafc;--line:#25384a;--coral:#ff8f72;--shadow:rgba(0,0,0,.45);--board:#1a2c3d;color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0e1a26;--ink:#e6eef6;--muted:#9fb2c6;--wave:#4fb3ff;--wave-deep:#7cc6ff;
  --card:#f7fafc;--line:#25384a;--coral:#ff8f72;--shadow:rgba(0,0,0,.45);--board:#1a2c3d;color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{text-align:center;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--display);color:var(--wave);letter-spacing:.08em;font-size:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,42px);margin:0;line-height:1.1}
.sub{color:var(--muted);margin:0;text-wrap:balance}

.hud{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);color:#1d3557;box-shadow:0 2px 6px var(--shadow)}
.stat b{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:#5b6b80}
.stat.low b{color:#d9532f}
.ctl{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.ctl:hover{border-color:var(--wave)}
button:focus-visible{outline:3px solid var(--wave);outline-offset:2px}
.timebar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--wave);transform-origin:left;transition:transform 1s linear}

#board{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;background:var(--board);border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.tile{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;transition:transform .2s ease;cursor:pointer;will-change:transform}
.tile .in{width:92%;height:92%;border-radius:22%;background:#fff;box-shadow:0 2px 4px rgba(29,53,87,.12);display:flex;align-items:center;justify-content:center;transition:transform .18s, opacity .18s, box-shadow .15s}
.tile img{width:92%;height:92%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;-webkit-user-drag:none}
.tile.sel .in{box-shadow:0 0 0 3px var(--coral),0 2px 6px rgba(29,53,87,.2);transform:scale(1.06)}
.tile.hint .in{animation:wiggle .5s ease 2}
.tile.pop .in{transform:scale(0);opacity:0}
@keyframes wiggle{25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}
.float{position:absolute;pointer-events:none;font-family:var(--display);color:#d9532f;font-size:clamp(16px,4.5vw,22px);
  text-shadow:0 1px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);animation:rise .8s ease forwards;white-space:nowrap}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}

#startCover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:rgba(242,246,249,.82);border-radius:16px;text-align:center;padding:16px}
#startCover p{margin:0;color:#1d3557;font-size:15px}
.go{font-family:var(--display);font-size:20px;border:0;border-radius:12px;padding:10px 26px;background:#3da9fc;color:#fff;cursor:pointer;box-shadow:0 4px 0 #1e88e5}
.go:hover{background:#1e88e5}

.catch{display:flex;flex-direction:column;gap:6px}
.catch h2{font-family:var(--display);font-weight:400;font-size:17px;margin:0}
#catch{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cnt{display:flex;flex-direction:column;align-items:center;background:var(--card);border-radius:10px;padding:4px 2px;color:#1d3557}
.cnt img{width:100%;max-width:56px;aspect-ratio:1/1;object-fit:contain;mix-blend-mode:multiply}
.cnt b{font-family:var(--display);font-weight:400;font-size:12px;line-height:1.2}
.cnt span{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;color:#d9532f}

#clear{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,26,38,.55);z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:#fff;color:#1d3557;border-radius:18px;padding:22px 20px;max-width:360px;width:100%;max-height:100%;overflow-y:auto;overscroll-behavior:contain;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.panel .cat{flex-shrink:0;width:130px;border-radius:14px;animation:dance .6s infinite alternate}
.panel h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.panel .result{font-family:var(--display);font-size:44px;line-height:1;color:#d9532f;margin:0;font-variant-numeric:tabular-nums}
.panel .msg{margin:0;font-size:15px}
.panel .haul{margin:0;font-size:14px;color:#5b6b80}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.go.brag{background:#ff7a59;width:100%;max-width:260px;box-shadow:0 4px 0 #d9532f}
.go.brag:hover{background:#f2643f}
#shareMsg{margin:0;font-size:14px;color:#d9532f;min-height:1.4em}
#shareBox{width:100%;font:inherit;font-size:14px;line-height:1.5;padding:8px;border:1px solid #d6e3ee;border-radius:10px;color:#1d3557;background:#f5f9fc;resize:none}
.shop{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff1ec;color:#1d3557;text-decoration:none;text-align:left;box-shadow:inset 0 0 0 2px #ffcbb9;width:100%}
.shop:hover{background:#ffe5db}
.shop span{flex:1;min-width:0;font-size:14px;line-height:1.45}
.shop strong{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:#d9532f}
.shop i{font-style:normal;font-family:var(--display);font-size:22px;color:#d9532f}
@keyframes dance{from{transform:rotate(-8deg)}to{transform:rotate(8deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.tile,.tile .in{transition:none}.panel .cat,.tile.hint .in{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">이상한생선가게 게임 4탄</div>
    <h1>생선 삼총사</h1>
    <p class="sub">생선을 옆 칸으로 밀어 같은 생선 세 마리를 한 줄로 모으면 팡! 60초 동안 얼마나 잡을 수 있을까요?</p>
  </header>

  <div class="hud">
    <div class="stat"><span>점수</span><b id="score">0</b></div>
    <div class="stat" id="timeStat"><span>남은 시간</span><b id="time">60</b><span>초</span></div>
    <div class="stat"><span>최고</span><b id="best">–</b></div>
    <button class="ctl" id="music" type="button">🎵 음악 끄기</button>
  </div>
  <div class="timebar" aria-hidden="true"><i id="bar"></i></div>

  <div id="board" aria-label="생선 보드">
    <div id="startCover">
      <p>생선을 누른 채 옆으로 밀거나,<br>생선 하나를 누르고 바로 옆 생선을 누르세요.</p>
      <button class="go" id="start" type="button">시작</button>
    </div>
  </div>

  <section class="catch">
    <h2>오늘 잡은 생선</h2>
    <div id="catch"></div>
  </section>
</div>

<div id="clear" hidden>
  <div class="panel" role="dialog" aria-labelledby="clearTitle">
    <img class="cat" src="images/cat216.webp" alt="엄지를 든 216고양이">
    <h2 id="clearTitle">시간 끝!</h2>
    <p class="result" id="result">0점</p>
    <p class="haul" id="haul"></p>
    <p class="msg" id="msg"></p>
    <button class="go brag" id="brag" type="button">기록 자랑하기</button>
    <p id="shareMsg" aria-live="polite"></p>
    <textarea id="shareBox" rows="6" readonly hidden aria-label="자랑 문구"></textarea>
    <div class="btns"><button class="go" id="restart" type="button">한 판 더</button></div>
    <a class="shop" href="https://ieumfish.co.kr" target="_blank" rel="noopener"><span><strong>ieumfish.co.kr</strong></span><i aria-hidden="true">→</i></a>
  </div>
</div>

<script>
(function(){
  const NAMES = ["광어","참돔","홍어","병어","삼치","아나고"];
  const T = NAMES.length, N = 6, GAME_SEC = 60;
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const snd = n => { const a = new Audio("sound/" + n + ".mp3"); a.preload = "auto"; return a; };
  const S = { bgm: snd("bgm"), flip: snd("flip"), match: snd("match"), fail: snd("fail"), clear: snd("clear") };
  S.bgm.loop = true; S.bgm.volume = .3; S.flip.volume = .5; S.match.volume = .7; S.fail.volume = .5; S.clear.volume = .8;
  let musicOn = true;
  const play = a => { try { a.currentTime = 0; const p = a.play(); if (p) p.catch(()=>{}); } catch(e){} };

  const KEY = "ieum-match3-best";
  const getBest = () => { try { const v = parseInt(localStorage.getItem(KEY), 10); return isNaN(v) ? null : v; } catch(e){ return null; } };
  const setBest = v => { try { localStorage.setItem(KEY, String(v)); } catch(e){} };

  const board = $("board");
  let grid = [], size = 0, score = 0, left = GAME_SEC, timer = null, busy = false, running = false, sel = null, hintT = null;
  let caught = new Array(T).fill(0);

  // 잡은 생선 칸
  NAMES.forEach((n, i) => {
    const d = document.createElement("div"); d.className = "cnt";
    d.innerHTML = '<img src="images/t' + i + '.webp" alt=""><b>' + n + '</b><span id="c' + i + '">0</span>';
    $("catch").appendChild(d);
  });

  const rnd = () => Math.floor(Math.random() * T);
  function makeTile(t, r, c, fromRow){
    const el = document.createElement("div");
    el.className = "tile t" + t;
    el.innerHTML = '<div class="in"><img src="images/t' + t + '.webp" alt="' + NAMES[t] + '"></div>';
    const o = { t, el, r, c };
    el._o = o;
    place(o, fromRow == null ? r : fromRow, true);
    board.appendChild(el);
    return o;
  }
  function place(o, row, instant){
    if (instant) o.el.style.transition = "none";
    o.el.style.width = o.el.style.height = size + "px";
    o.el.style.transform = "translate(" + (o.c * size) + "px," + (row * size) + "px)";
    if (instant) { o.el.offsetWidth; o.el.style.transition = ""; }
  }
  function measure(){ size = board.clientWidth / N; }
  function layout(){ measure(); grid.forEach(row => row.forEach(o => o && place(o, o.r, true))); }

  function newBoard(){
    board.querySelectorAll(".tile").forEach(e => e.remove());
    measure();
    grid = [];
    for (let r = 0; r < N; r++) {
      grid.push([]);
      for (let c = 0; c < N; c++) {
        let t;
        do { t = rnd(); } while ((c >= 2 && grid[r][c-1].t === t && grid[r][c-2].t === t) || (r >= 2 && grid[r-1][c].t === t && grid[r-2][c].t === t));
        grid[r].push(makeTile(t, r, c));
      }
    }
    if (!findMove()) newBoard();
  }

  function findMatches(){
    const hit = new Set();
    for (let r = 0; r < N; r++) for (let c = 0; c < N - 2; c++) {
      const t = grid[r][c].t;
      if (grid[r][c+1].t === t && grid[r][c+2].t === t) { let k = c; while (k < N && grid[r][k].t === t) hit.add(grid[r][k++]); }
    }
    for (let c = 0; c < N; c++) for (let r = 0; r < N - 2; r++) {
      const t = grid[r][c].t;
      if (grid[r+1][c].t === t && grid[r+2][c].t === t) { let k = r; while (k < N && grid[k][c].t === t) hit.add(grid[k++][c]); }
    }
    return [...hit];
  }
  function swapGrid(a, b){
    grid[a.r][a.c] = b; grid[b.r][b.c] = a;
    [a.r, b.r] = [b.r, a.r]; [a.c, b.c] = [b.c, a.c];
  }
  function findMove(){
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      for (const [dr, dc] of [[0,1],[1,0]]) {
        const r2 = r + dr, c2 = c + dc; if (r2 >= N || c2 >= N) continue;
        const a = grid[r][c], b = grid[r2][c2];
        swapGrid(a, b); const ok = findMatches().length > 0; swapGrid(a, b);
        if (ok) return [a, b];
      }
    }
    return null;
  }

  function floatText(text, x, y){
    const f = document.createElement("div"); f.className = "float"; f.textContent = text;
    f.style.left = x + "px"; f.style.top = y + "px"; board.appendChild(f);
    setTimeout(() => f.remove(), 800);
  }

  async function resolve(){
    let combo = 0;
    while (true) {
      const m = findMatches();
      if (!m.length) break;
      combo++;
      const gain = m.length * 10 * combo;
      score += gain; $("score").textContent = score;
      m.forEach(o => { caught[o.t]++; o.el.classList.add("pop"); });
      for (let i = 0; i < T; i++) $("c" + i).textContent = caught[i];
      const cx = m.reduce((s, o) => s + o.c, 0) / m.length, cy = m.reduce((s, o) => s + o.r, 0) / m.length;
      floatText("+" + gain + (combo > 1 ? " 연속 " + combo + "!" : ""), (cx + .5) * size, (cy + .5) * size);
      play(S.match);
      await wait(200);
      m.forEach(o => { o.el.remove(); grid[o.r][o.c] = null; });
      // 아래로 떨어뜨리고 위에서 채우기
      for (let c = 0; c < N; c++) {
        let w = N - 1;
        for (let r = N - 1; r >= 0; r--) {
          const o = grid[r][c];
          if (o) { if (w !== r) { grid[w][c] = o; grid[r][c] = null; o.r = w; } w--; }
        }
        const missing = w + 1;
        for (let r = w; r >= 0; r--) grid[r][c] = makeTile(rnd(), r, c, r - missing);
      }
      board.offsetWidth;
      grid.forEach(row => row.forEach(o => place(o, o.r)));
      await wait(240);
    }
    if (!findMove()) { floatText("생선 다시 섞는 중!", board.clientWidth / 2, board.clientHeight / 2); await wait(500); newBoard(); }
  }

  async function trySwap(a, b){
    if (busy || !running) return;
    if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return;
    busy = true; clearHint(); setSel(null);
    swapGrid(a, b); place(a, a.r); place(b, b.r); play(S.flip);
    await wait(200);
    if (findMatches().length) { await resolve(); }
    else { play(S.fail); swapGrid(a, b); place(a, a.r); place(b, b.r); await wait(200); }
    busy = false;
    if (left <= 0) end(); else armHint();
  }

  function setSel(o){
    if (sel) sel.el.classList.remove("sel");
    sel = o; if (o) o.el.classList.add("sel");
  }
  function clearHint(){ clearTimeout(hintT); board.querySelectorAll(".hint").forEach(e => e.classList.remove("hint")); }
  function armHint(){
    clearHint();
    hintT = setTimeout(() => { const m = findMove(); if (m && running && !busy) m.forEach(o => o.el.classList.add("hint")); }, 5000);
  }

  // 누르고 밀기 + 두 번 누르기
  let down = null;
  board.addEventListener("pointerdown", e => {
    const el = e.target.closest(".tile"); if (!el || !running || busy) return;
    down = { o: el._o, x: e.clientX, y: e.clientY, moved: false };
  });
  board.addEventListener("pointermove", e => {
    if (!down || down.moved) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < size * .3) return;
    down.moved = true;
    const a = down.o; let r = a.r, c = a.c;
    if (Math.abs(dx) > Math.abs(dy)) c += dx > 0 ? 1 : -1; else r += dy > 0 ? 1 : -1;
    if (r >= 0 && r < N && c >= 0 && c < N) trySwap(a, grid[r][c]);
  });
  window.addEventListener("pointerup", () => {
    if (!down) return;
    const o = down.o, moved = down.moved; down = null;
    if (moved || !running || busy) return;
    if (sel && sel !== o && Math.abs(sel.r - o.r) + Math.abs(sel.c - o.c) === 1) trySwap(sel, o);
    else setSel(sel === o ? null : o);
  });

  function tick(){
    left--; $("time").textContent = Math.max(0, left);
    $("bar").style.transform = "scaleX(" + Math.max(0, left) / GAME_SEC + ")";
    $("timeStat").classList.toggle("low", left <= 10);
    if (left <= 0) { clearInterval(timer); timer = null; if (!busy) end(); }
  }

  function start(){
    score = 0; left = GAME_SEC; caught.fill(0); busy = false; setSel(null);
    $("score").textContent = 0; $("time").textContent = GAME_SEC; $("timeStat").classList.remove("low");
    $("bar").style.transition = "none"; $("bar").style.transform = "scaleX(1)"; $("bar").offsetWidth; $("bar").style.transition = "";
    for (let i = 0; i < T; i++) $("c" + i).textContent = 0;
    const b = getBest(); $("best").textContent = b == null ? "–" : b;
    $("clear").hidden = true; $("startCover").hidden = true;
    $("shareMsg").textContent = ""; $("shareBox").hidden = true;
    newBoard();
    running = true;
    clearInterval(timer); timer = setInterval(tick, 1000);
    if (musicOn) play(S.bgm);
    armHint();
  }

  function end(){
    if (!running) return;
    running = false; clearHint(); setSel(null);
    S.bgm.pause(); play(S.clear);
    const prev = getBest();
    $("result").textContent = score + "점";
    const total = caught.reduce((a, b) => a + b, 0);
    const topI = caught.indexOf(Math.max(...caught));
    $("haul").textContent = total ? "생선 " + total + "마리를 잡았어요. 제일 많이 잡은 건 " + NAMES[topI] + " " + caught[topI] + "마리!" : "";
    let msg;
    if (prev == null) msg = "첫 기록이에요. 다음 판은 이 점수와 겨뤄 봐요.";
    else if (score > prev) msg = "지난 최고 점수보다 " + (score - prev) + "점 올랐어요!";
    else if (score === prev) msg = "최고 점수와 똑같아요. 한 끗 차이!";
    else msg = "최고 점수는 " + prev + "점. 지난번의 나에게 조금씩 다가가는 중이에요.";
    $("msg").textContent = msg;
    if (prev == null || score > prev) { setBest(score); $("best").textContent = score; }
    setTimeout(() => { $("clear").hidden = false; $("brag").focus(); }, 400);
  }

  $("start").addEventListener("click", start);
  $("restart").addEventListener("click", start);
  $("music").addEventListener("click", () => {
    musicOn = !musicOn;
    $("music").textContent = musicOn ? "🎵 음악 끄기" : "🎵 음악 켜기";
    if (musicOn && running) play(S.bgm); else S.bgm.pause();
  });
  window.addEventListener("resize", layout);

  // 기록 자랑하기
  const GAME_URL = "https://hangunada-create.github.io/fishgame/4/";
  function bragText(){
    const total = caught.reduce((a, b) => a + b, 0);
    return ["🐟 생선 삼총사", "60초 동안 생선 " + total + "마리를 잡아서 " + score + "점!", "나보다 많이 잡을 수 있어?", "👉 " + GAME_URL].join("\n");
  }
  function copyOld(text){
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove(); return ok;
  }
  $("brag").addEventListener("click", async () => {
    const text = bragText();
    const touch = window.matchMedia && matchMedia("(pointer:coarse)").matches;
    if (touch && navigator.share) {
      try { await navigator.share({ text }); $("shareMsg").textContent = "자랑 완료! 친구 점수도 궁금하네요."; return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(text); $("shareMsg").textContent = "복사했어요. 카톡방에 붙여 넣어 보세요!"; }
    catch (e) {
      if (copyOld(text)) $("shareMsg").textContent = "복사했어요. 카톡방에 붙여 넣어 보세요!";
      else { const box = $("shareBox"); box.value = text; box.hidden = false; box.select(); $("shareMsg").textContent = "아래 문구를 길게 눌러 복사해 주세요."; }
    }
  });

  newBoard();
  $("best").textContent = getBest() == null ? "–" : getBest();
})();
</script>
</body>
</html>
