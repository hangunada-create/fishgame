<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>생선 짝꿍 찾기 · 이상한생선가게 기억 게임 1탄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="이음수산 생선 12종의 짝을 찾아 주세요. 이상한생선가게 기억 게임 1탄">
<meta property="og:type" content="website">
<meta property="og:title" content="생선 짝꿍 찾기 · 이상한생선가게 기억 게임 1탄">
<meta property="og:description" content="12종의 생선을 짝지어 보세요. 60초 안에 성공하면 기억력 천재!">
<meta property="og:image" content="https://hangunada-create.github.io/fishgame/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://hangunada-create.github.io/fishgame/">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3da9fc">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 위에 기록판, 가운데 카드 판. 시작 화면에서 판 크기를 고르고, 다 맞추면 결과 창.
   색과 글꼴은 2탄과 같은 계열로 맞춤 (1탄의 하늘색 바탕·파란 버튼을 이어받음) */
:root{
  --sea:#f2f6f9; --ink:#1d3557; --muted:#5b6b80;
  --wave:#3da9fc; --wave-deep:#1e88e5;
  --card:#ffffff; --line:#d6e3ee; --coral:#ff7a59;
  --shadow:rgba(29,53,87,.14);
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0e1a26;--ink:#e6eef6;--muted:#9fb2c6;--wave:#4fb3ff;--wave-deep:#7cc6ff;
  --card:#f7fafc;--line:#25384a;--coral:#ff8f72;--shadow:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0e1a26;--ink:#e6eef6;--muted:#9fb2c6;--wave:#4fb3ff;--wave-deep:#7cc6ff;
  --card:#f7fafc;--line:#25384a;--coral:#ff8f72;--shadow:rgba(0,0,0,.45);color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

header{text-align:center;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--display);color:var(--wave);letter-spacing:.08em;font-size:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,38px);margin:0;line-height:1.15;text-wrap:balance}

.hud{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:5px;padding:5px 12px;border-radius:999px;background:var(--card);color:#1d3557;box-shadow:0 2px 6px var(--shadow)}
.stat b{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:#5b6b80}
.ctl{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.ctl:hover{border-color:var(--wave)}
button:focus-visible,a:focus-visible{outline:3px solid var(--wave);outline-offset:2px}

#news{text-align:center;min-height:1.5em;margin:0;font-family:var(--display);color:var(--coral);font-size:17px}

#board{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
#board.small{grid-template-columns:repeat(4,1fr);max-width:460px;margin:0 auto;width:100%}
@media (max-width:600px){#board{grid-template-columns:repeat(4,1fr);gap:8px}}
.card{aspect-ratio:1/1;max-width:100%;perspective:900px;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 4px 10px var(--shadow)}
.back img{width:100%;height:100%;object-fit:cover;display:block}
.front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.front img{width:92%;height:78%;object-fit:contain;display:block;transition:transform .3s .15s}
.card.matched .front img{transform:translateY(-11%) scale(.8)}
/* 짝을 맞추면 카드 아래에 이름표가 붙는다 */
.front .tag{position:absolute;left:0;right:0;bottom:0;padding:2px 0 4px;font-family:var(--display);font-size:clamp(12px,3.4vw,16px);
  color:#fff;background:var(--coral);opacity:0;transform:translateY(100%);transition:opacity .3s .15s,transform .3s .15s}
.card.matched .tag{opacity:1;transform:none}
.card.matched .face{box-shadow:0 0 0 3px var(--coral),0 4px 10px var(--shadow)}
.card.matched{cursor:default}
.card.matched .front{animation:pop .4s ease}
.card.wrong .front{animation:shake .35s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.08)}}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-4px)}75%{transform:rotateY(180deg) translateX(4px)}}

/* 시작·결과 창 공통 */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,26,38,.55);z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:#ffffff;color:#1d3557;border-radius:18px;padding:22px 20px;max-width:380px;width:100%;max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.panel h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.2}
.panel p{margin:0}
.panel .lead{color:#5b6b80;text-wrap:balance}
.shoal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%}
.shoal img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f5f9fc;border-radius:8px}
.modes{display:flex;flex-direction:column;gap:8px;width:100%}
.mode{font:inherit;text-align:left;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;
  background:#f5f9fc;color:#1d3557;box-shadow:inset 0 0 0 2px #d6e3ee}
.mode:hover{box-shadow:inset 0 0 0 2px #3da9fc}
.mode.main{background:#3da9fc;color:#fff;box-shadow:0 4px 0 #1e88e5}
.mode.main:hover{background:#1e88e5}
.mode span{flex:1;min-width:0}
.mode strong{display:block;font-family:var(--display);font-weight:400;font-size:20px}
.mode small{font-size:13px;opacity:.85}
.mode i{font-style:normal;font-family:var(--display);font-size:13px;white-space:nowrap;opacity:.9}

.cat{flex-shrink:0;width:140px;border-radius:14px;animation:dance .6s infinite alternate}
.result{font-variant-numeric:tabular-nums;color:#5b6b80}
.msg{font-size:16px}
.badge{font-family:var(--display);background:#fff1ec;color:#d9532f;border-radius:999px;padding:3px 12px}
.go{font-family:var(--display);font-size:19px;border:0;border-radius:12px;padding:10px 22px;background:#3da9fc;color:#fff;cursor:pointer}
.go:hover{background:#1e88e5}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.go.sub{background:#fff;color:#1e88e5;box-shadow:inset 0 0 0 2px #3da9fc}
.go.sub:hover{background:#eef7ff}
.go.brag{background:#ff7a59;width:100%;max-width:260px;box-shadow:0 4px 0 #d9532f}
.go.brag:hover{background:#f2643f}
.go.brag:active{transform:translateY(2px);box-shadow:0 2px 0 #d9532f}
#shareMsg{font-size:14px;color:#d9532f;min-height:1.4em}
#shareBox{width:100%;font:inherit;font-size:14px;line-height:1.5;padding:8px;border:1px solid #d6e3ee;border-radius:10px;color:#1d3557;background:#f5f9fc;resize:none}
#fishList{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:12px;border-top:1px dashed #d6e3ee}
#fishList h3{grid-column:1/-1;font-family:var(--display);font-weight:400;font-size:18px;margin:0}
.fish{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 4px;border-radius:10px;background:#f5f9fc}
.fish img{width:100%;aspect-ratio:1/1;object-fit:contain}
.fish b{font-family:var(--display);font-weight:400;font-size:16px}
.fish.dim{opacity:.35}
.shop{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff1ec;color:#1d3557;text-decoration:none;text-align:left;box-shadow:inset 0 0 0 2px #ffcbb9}
.shop:hover{background:#ffe5db}
.shop span{flex:1;min-width:0;font-size:14px;line-height:1.45}
.shop strong{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:#d9532f}
.shop i{font-style:normal;font-family:var(--display);font-size:22px;color:#d9532f}
.more{font-size:14px;color:#5b6b80}
.more a{color:#1e88e5}
@keyframes dance{from{transform:rotate(-8deg)}to{transform:rotate(8deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">이상한생선가게 기억 게임 1탄</div>
    <h1>생선 짝꿍 찾기</h1>
  </header>

  <div class="hud">
    <div class="stat"><span>시간</span><b id="time">0</b><span>초</span></div>
    <div class="stat"><span>뒤집기</span><b id="flips">0</b><span>번</span></div>
    <div class="stat"><span>짝</span><b id="count">0</b><span id="total">/ 12</span></div>
    <button class="ctl" id="music" type="button">🎵 음악 끄기</button>
    <button class="ctl" id="menu" type="button">처음으로</button>
  </div>

  <p id="news" aria-live="polite"></p>

  <div id="board" aria-label="카드 판"></div>
</div>

<!-- 시작 화면 -->
<div class="overlay" id="start">
  <div class="panel" role="dialog" aria-labelledby="startTitle">
    <h2 id="startTitle">생선 짝꿍 찾기</h2>
    <p class="lead">카드를 두 장씩 뒤집어 같은 생선을 찾아 주세요. 짝을 맞추면 생선 이름이 나와요.</p>
    <div class="shoal" id="shoal" aria-hidden="true"></div>
    <div class="modes">
      <button class="mode main" type="button" data-mode="full">
        <span><strong>도전 · 12쌍</strong><small>60초 안에 성공하면 기억력 천재</small></span><i id="bestFull"></i>
      </button>
      <button class="mode" type="button" data-mode="easy">
        <span><strong>연습 · 8쌍</strong><small>처음이거나 아이와 함께라면</small></span><i id="bestEasy"></i>
      </button>
    </div>
  </div>
</div>

<!-- 결과 창 -->
<div class="overlay" id="clear" hidden>
  <div class="panel" role="dialog" aria-labelledby="clearTitle">
    <img class="cat" src="images/cat216.webp" alt="엄지를 든 216고양이">
    <h2 id="clearTitle">게임 성공!</h2>
    <p class="result" id="result"></p>
    <span class="badge" id="genius" hidden>60초 안에 성공 · 기억력 천재</span>
    <p class="msg" id="msg"></p>
    <button class="go brag" id="brag" type="button">기록 자랑하기</button>
    <p id="shareMsg" aria-live="polite"></p>
    <textarea id="shareBox" rows="6" readonly hidden aria-label="자랑 문구"></textarea>
    <div class="btns">
      <button class="go" id="restart" type="button">한 판 더</button>
      <button class="go sub" id="switch" type="button"></button>
    </div>
    <div id="fishList">
      <h3>오늘 만난 생선</h3>
    </div>
    <p class="more">다음 판: <a href="2/">반반 생선 짝맞추기 →</a></p>
    <p class="more"><a href="privacy.html">개인정보 처리방침</a></p>
  </div>
</div>

<script>
(function(){
  // 그림 번호 순서대로의 생선 이름 (images/fish1~12)
  const NAMES = ["광어","홍어","웅어","숭어","병어","밴댕이","아나고","참돔","전어","민어","준치","삼치"];
  const MODES = {
    full: { pairs: 12, label: "도전", key: "ieum-memory1-best-full" },
    easy: { pairs: 8,  label: "연습", key: "ieum-memory1-best-easy" }
  };
  const $ = id => document.getElementById(id);

  // 소리: 첫 버튼을 누른 뒤에만 재생 (브라우저 자동재생 차단 대응)
  const snd = n => { const a = new Audio("sound/" + n + ".mp3"); a.preload = "auto"; return a; };
  const S = { bgm: snd("bgm"), flip: snd("flip"), match: snd("match"), fail: snd("fail"), clear: snd("clear") };
  S.bgm.loop = true; S.bgm.volume = .3; S.flip.volume = .6; S.match.volume = .8; S.fail.volume = .6; S.clear.volume = .8;
  let musicOn = true;
  const play = a => { try { a.currentTime = 0; const p = a.play(); if (p) p.catch(()=>{}); } catch(e){} };
  // 다른 앱으로 넘어가면 음악을 멈추고, 돌아오면 이어서
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) S.bgm.pause();
    else if (musicOn && playing) { const p = S.bgm.play(); if (p) p.catch(()=>{}); }
  });

  const getBest = k => { try { const v = parseInt(localStorage.getItem(k), 10); return isNaN(v) ? null : v; } catch(e){ return null; } };
  const setBest = (k, v) => { try { localStorage.setItem(k, String(v)); } catch(e){} };

  let mode = "full", inPlay = [], first = null, lock = false, matched = 0, flips = 0, time = 0, timer = null, playing = false;

  function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // 시작 화면
  NAMES.forEach((n, k) => { const im = document.createElement("img"); im.src = "images/fish" + (k + 1) + ".webp"; im.alt = ""; $("shoal").appendChild(im); });
  function showStart(){
    clearInterval(timer); timer = null; playing = false; S.bgm.pause();
    const bf = getBest(MODES.full.key), be = getBest(MODES.easy.key);
    $("bestFull").textContent = bf == null ? "" : "최고 " + bf + "초";
    $("bestEasy").textContent = be == null ? "" : "최고 " + be + "초";
    $("clear").hidden = true; $("start").hidden = false;
    document.querySelector(".mode.main").focus();
  }
  document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => begin(b.dataset.mode)));

  function begin(m){
    mode = m; $("start").hidden = true; deal();
    if (musicOn) play(S.bgm);
  }

  function deal(){
    clearInterval(timer); timer = null;
    const M = MODES[mode];
    first = null; lock = false; matched = 0; flips = 0; time = 0; playing = true;
    $("time").textContent = 0; $("flips").textContent = 0; $("count").textContent = 0; $("total").textContent = "/ " + M.pairs;
    $("news").textContent = "아무 카드나 눌러 시작하세요. 시간은 첫 카드부터 재요.";
    $("clear").hidden = true; $("shareMsg").textContent = ""; $("shareBox").hidden = true;
    // 연습 판은 12종 가운데 8종을 골라 쓴다
    inPlay = shuffle([...Array(12).keys()]).slice(0, M.pairs).sort((a, b) => a - b);
    const board = $("board"); board.innerHTML = "";
    board.classList.toggle("small", M.pairs === 8);
    shuffle([...inPlay, ...inPlay]).forEach(f => {
      const el = document.createElement("button");
      el.type = "button"; el.className = "card";
      el.setAttribute("aria-label", "뒤집힌 카드");
      el.innerHTML = '<div class="inner"><div class="face back"><img src="images/back.webp" alt=""></div>' +
        '<div class="face front"><img src="images/fish' + (f + 1) + '.webp" alt=""><span class="tag">' + NAMES[f] + '</span></div></div>';
      el.addEventListener("click", () => flip(el, f));
      board.appendChild(el);
    });
  }

  function startClock(){
    if (timer) return;
    timer = setInterval(() => { time++; $("time").textContent = time; }, 1000);
  }

  function flip(el, f){
    if (lock || el.classList.contains("flipped") || el.classList.contains("matched")) return;
    startClock();
    el.classList.add("flipped");
    el.setAttribute("aria-label", NAMES[f]);
    flips++; $("flips").textContent = flips;
    play(S.flip);
    if (!first) { first = { el, f }; if (flips === 1) $("news").textContent = ""; return; }
    const a = first; first = null;
    if (a.f === f) {
      [a.el, el].forEach(x => { x.classList.remove("flipped"); x.classList.add("matched"); x.setAttribute("aria-label", NAMES[f] + " 짝 완성"); });
      play(S.match);
      matched++; $("count").textContent = matched;
      $("news").textContent = NAMES[f] + " 짝꿍 찾았다!";
      if (matched === MODES[mode].pairs) finish();
    } else {
      lock = true; play(S.fail);
      [a.el, el].forEach(x => x.classList.add("wrong"));
      setTimeout(() => {
        [a.el, el].forEach(x => { x.classList.remove("flipped", "wrong"); x.setAttribute("aria-label", "뒤집힌 카드"); });
        lock = false;
      }, 900);
    }
  }

  function finish(){
    clearInterval(timer); timer = null; playing = false;
    S.bgm.pause(); play(S.clear);
    const M = MODES[mode], prev = getBest(M.key);
    $("clearTitle").textContent = M.pairs + "쌍 모두 찾았어요!";
    $("result").textContent = M.label + " · " + time + "초 · 뒤집기 " + flips + "번";
    $("genius").hidden = !(mode === "full" && time <= 60);
    let msg;
    if (prev == null) msg = "첫 기록이에요. 다음 판은 이 기록과 겨뤄 봐요.";
    else if (time < prev) msg = "지난 최고 기록보다 " + (prev - time) + "초 빨라졌어요!";
    else if (time === prev) msg = "최고 기록과 똑같아요. 한 끗 차이!";
    else msg = "최고 기록은 " + prev + "초. 지난번의 나에게 조금씩 다가가는 중이에요.";
    if (mode === "easy") msg += " 이제 도전 판(12쌍)도 해 볼까요?";
    $("msg").textContent = msg;
    if (prev == null || time < prev) setBest(M.key, time);
    $("switch").textContent = mode === "easy" ? "도전 판으로" : "연습 판으로";
    // 오늘 만난 생선: 이번 판에 나온 생선은 진하게
    document.querySelectorAll("#fishList .fish").forEach((d, k) => d.classList.toggle("dim", !inPlay.includes(k)));
    setTimeout(() => { $("clear").hidden = false; $("brag").focus(); }, 600);
  }

  // 오늘 만난 생선 목록 + 가게 안내
  const list = $("fishList");
  NAMES.forEach((name, k) => {
    const d = document.createElement("div");
    d.className = "fish";
    d.innerHTML = '<img src="images/fish' + (k + 1) + '.webp" alt="" loading="lazy"><b>' + name + '</b>';
    list.appendChild(d);
  });
  const shop = document.createElement("a");
  shop.className = "shop"; shop.href = "https://ieumfish.co.kr"; shop.target = "_blank"; shop.rel = "noopener";
  shop.innerHTML = '<span><strong>이 생선들, 진짜로 들어와요</strong>목포 자유시장 이상한 생선가게 이음수산에 제철마다 들어오는 생선이에요.</span><i aria-hidden="true">→</i>';
  list.appendChild(shop);

  $("music").addEventListener("click", () => {
    musicOn = !musicOn;
    $("music").textContent = musicOn ? "🎵 음악 끄기" : "🎵 음악 켜기";
    if (musicOn && playing) play(S.bgm); else S.bgm.pause();
  });
  $("menu").addEventListener("click", showStart);
  $("restart").addEventListener("click", () => { if (musicOn) play(S.bgm); deal(); });
  $("switch").addEventListener("click", () => begin(mode === "easy" ? "full" : "easy"));

  // 기록 자랑하기
  const GAME_URL = "https://hangunada-create.github.io/fishgame/";
  function bragText(){
    const M = MODES[mode];
    const lines = ["🐟 생선 짝꿍 찾기 (" + M.label + ")", "생선 " + M.pairs + "쌍을 " + time + "초 만에 찾았어요! (뒤집기 " + flips + "번)"];
    if (mode === "full" && time <= 60) lines.push("🏅 기억력 천재 인증");
    lines.push("나보다 빨리 찾을 수 있어?", "👉 " + GAME_URL);
    return lines.join("\n");
  }
  function copyOld(text){
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    ta.remove(); return ok;
  }
  $("brag").addEventListener("click", async () => {
    const text = bragText();
    const touch = window.matchMedia && matchMedia("(pointer:coarse)").matches;
    if (touch && navigator.share) {
      try { await navigator.share({ text: text }); $("shareMsg").textContent = "자랑 완료! 친구 기록도 궁금하네요."; return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(text); $("shareMsg").textContent = "복사했어요. 카톡방에 붙여 넣어 보세요!"; }
    catch (e) {
      if (copyOld(text)) $("shareMsg").textContent = "복사했어요. 카톡방에 붙여 넣어 보세요!";
      else { const box = $("shareBox"); box.value = text; box.hidden = false; box.focus(); box.select(); $("shareMsg").textContent = "아래 문구를 길게 눌러 복사해 주세요."; }
    }
  });

  showStart();
})();
// 설치형 앱(PWA)·오프라인 지원
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
