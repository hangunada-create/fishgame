<style>
/* 레이아웃: 시장 생선가게의 이름표처럼 한 장짜리 카드. 시작 → 질문 8개 → 도감 결과 카드 */
:root{
  --bg:#EEF4F2; --surface:#FFFFFF; --ink:#12302E; --muted:#56706C;
  --accent:#1E7C74; --accent-ink:#FFFFFF; --sun:#F2B632; --line:#CFDDDA; --soft:#E2EDEA;
  --paper:#FFFFFF; /* 수채화 그림 바탕. 두 테마 모두 흰 종이 */
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B1A; --surface:#152826; --ink:#E6F0EE; --muted:#93AAA6;
  --accent:#5CC2B6; --accent-ink:#0E1B1A; --sun:#F2C255; --line:#2A403D; --soft:#1C3330; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1B1A; --surface:#152826; --ink:#E6F0EE; --muted:#93AAA6;
  --accent:#5CC2B6; --accent-ink:#0E1B1A; --sun:#F2C255; --line:#2A403D; --soft:#1C3330; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(34px,9vw,46px)}
h2{font-size:clamp(22px,6vw,27px)}
p{margin:0}
.lead{color:var(--muted)}
.shoal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shoal span{background:var(--paper);border-radius:10px;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;padding:6px;max-width:100%}
.shoal img{width:100%;height:100%;object-fit:contain;display:block}
.btn{appearance:none;border:0;border-radius:12px;padding:15px 18px;font-family:var(--f-display);font-size:19px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;display:block}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-size:17px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;font-family:var(--f-body);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.99)}
.dex{display:flex;align-items:center;justify-content:space-between}
.dexno{font-family:var(--f-mono);font-size:13px;background:var(--sun);color:#12302E;padding:3px 9px;border-radius:6px}
.hero{background:var(--paper);border-radius:14px;padding:14px;display:flex;justify-content:center;align-items:center;min-height:180px}
.hero img{width:100%;max-width:440px;max-height:280px;object-fit:contain;display:block}
.nick{font-family:var(--f-display);font-size:18px;color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;border-top:1.5px dashed var(--line);padding-top:16px;font-size:15px}
.facts dt{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px}
.facts dd{margin:0}
.lore{background:var(--bg);border-radius:12px;padding:14px 16px;font-size:15px}
.lore b{font-family:var(--f-display);font-weight:400;color:var(--accent)}
.actions{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dexgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dexcard{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--f-body)}
.dexcard:hover{border-color:var(--accent)}
.dexcard:focus-visible,.link:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.dexcard .pic{background:var(--paper);border-radius:8px;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;padding:6px}
.dexcard img{width:100%;height:100%;object-fit:contain;display:block}
.dexcard b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.2}
.dexcard small{font-size:13px;color:var(--muted);line-height:1.4}
.link{appearance:none;background:none;border:0;color:var(--muted);font-family:var(--f-body);font-size:14px;text-decoration:underline;cursor:pointer;padding:4px;align-self:center}
@media (min-width:520px){.dexgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sound{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;border-radius:20px;padding:5px 12px;cursor:pointer}
.sound[aria-pressed="false"]{opacity:.6}
.sound:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.toast{font-size:14px;color:var(--accent);text-align:center;min-height:1.4em}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.foot a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i,.opt{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand"><span>이상한 생선가게 이음수산</span><button class="sound" id="sound" type="button" aria-pressed="true">♪ 소리 켜짐</button></div>

  <section class="card" id="start">
    <p class="meta">대표생선 12종 · 질문 8개 · 1분</p>
    <h1>나는 무슨 생선일까?</h1>
    <p class="lead">목포 자유시장 생선가게가 바다에서 12가지 성격을 건져 왔어요. 질문 8개에 답하면 당신과 닮은 생선 한 마리가 도감에 올라갑니다.</p>
    <div class="shoal" id="shoal" aria-hidden="true"></div>
    <button class="btn" id="go" type="button">테스트 시작하기</button>
    <button class="link" id="dexStart" type="button">결과로 나오는 생선 12종 미리 보기</button>
  </section>

  <section class="card" id="quiz" hidden>
    <div class="progress"><span class="meta" id="count">1 / 8</span><div class="bar"><i id="barfill"></i></div></div>
    <h2 id="qtext"></h2>
    <div class="opts" id="opts"></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="dex"><span class="meta" id="rlabel">당신과 닮은 생선은</span><span class="dexno" id="rno"></span></div>
    <div class="hero" id="rart"></div>
    <div>
      <h1 id="rname"></h1>
      <p class="nick" id="rnick"></p>
    </div>
    <p id="rdesc"></p>
    <div class="lore" id="rlore"></div>
    <dl class="facts">
      <dt>제철</dt><dd id="rseason"></dd>
      <dt>단짝 생선</dt><dd id="rmate"></dd>
    </dl>
    <div class="actions">
      <a class="btn" id="rbuy" href="https://ieumfish.co.kr/shop" target="_blank" rel="noopener">내 생선 맛보러 가기</a>
      <div class="row">
        <button class="btn ghost" id="share" type="button">결과 공유하기</button>
        <button class="btn ghost" id="again" type="button">다시 하기</button>
      </div>
      <a class="btn ghost" href="https://ieumfish.co.kr/" target="_blank" rel="noopener">회원가입하고 제철 알림 받기</a>
      <button class="link" id="dexRes" type="button">도감 12종 모두 보기</button>
      <p class="toast" id="toast" role="status"></p>
    </div>
  </section>

  <section class="card" id="dex" hidden>
    <p class="meta">이상한 생선가게 대표생선 도감</p>
    <h2>12종 모두 보기</h2>
    <p class="lead">생선을 누르면 그 생선의 결과 화면이 열려요.</p>
    <div class="dexgrid" id="dexgrid"></div>
    <button class="btn" id="dexGo" type="button">나도 테스트하기</button>
  </section>

  <p class="foot">make life yummy · we are all connected<br><a href="https://ieumfish.co.kr/" target="_blank" rel="noopener">ieumfish.co.kr</a></p>
</div>

<script>
// 축: A 움직임(+활동 / -고요), B 거리(+멀리 / -머무름), C 결(+섬세 / -털털), D 맛(+독특 / -무난)
const FISH = [
 {id:"sungeo", no:"001", name:"참숭어", shape:"fish", color:"#7E93A0", v:[2,0,-1,0],
  nick:"뛰어오르는 행동파",
  desc:"생각보다 몸이 먼저 나갑니다. 당신이 움직이면 주변도 덩달아 움직여요. 겨울 찬물에서 오히려 맛이 오르는 숭어처럼, 힘든 시기에 더 단단해지는 사람입니다.",
  lore:"숭어는 수면 위로 불쑥 뛰어오르는 생선이에요. <b>숭어가 뛰니 망둥이도 뛴다</b>는 속담이 있을 정도죠.",
  season:"겨울 (12~2월)", mate:"홍어", url:"https://ieumfish.co.kr/1494112282"},
 {id:"chamdom", no:"002", name:"참돔", shape:"fish", color:"#D9727A", v:[0,0,2,-2],
  nick:"자리를 빛내는 바다의 여왕",
  desc:"어디에 있든 분위기를 단정하게 만드는 사람. 섬세하게 챙기지만 티 내지 않고, 누구와 있어도 품위를 잃지 않습니다. 잔칫상에 오르는 생선이 괜히 참돔이 아니에요.",
  lore:"붉은 빛깔 덕에 예부터 <b>잔치와 축하의 생선</b>으로 귀하게 대접받았어요.",
  season:"봄 (3~5월)", mate:"전어", url:"https://ieumfish.co.kr/1277364305"},
 {id:"junchi", no:"003", name:"준치", shape:"fish", color:"#A7B6C2", v:[-1,1,2,1],

  desc:"처음엔 다가가기 어렵다는 말을 듣지만, 알고 나면 누구보다 깊은 맛이 나는 사람. 쉽게 흔들리지 않고, 시간이 지나도 당신다움을 잃지 않습니다.",
  lore:"<b>썩어도 준치</b>라는 말, 들어 보셨죠? 가시가 많기로 유명하지만 그만큼 맛이 좋아 생긴 말이에요.",
  season:"봄 (3~5월)", mate:"병어", url:"https://ieumfish.co.kr/48"},
 {id:"ungeo", no:"004", name:"웅어", shape:"slim", color:"#B9C7A3", v:[1,2,1,1],
  nick:"물길을 거슬러 오르는 모험가",
  desc:"남들이 가는 방향보다 내가 가 보고 싶은 쪽이 궁금한 사람. 낯선 곳에서 오히려 감각이 살아나고, 돌아와서 들려주는 이야기가 늘 재미있습니다.",
  lore:"웅어는 봄이면 <b>바다에서 강으로 거슬러</b> 올라오는 생선이에요. 짧은 봄에만 만날 수 있어요.",

 {id:"byeongeo", no:"005", name:"병어", shape:"round", color:"#C9CED6", v:[-2,-1,1,-1],
  nick:"조용하고 부드러운 은빛",
  desc:"말수는 적어도 곁에 있으면 마음이 편해지는 사람. 크게 드러내지 않고 담백하게 자기 할 일을 합니다. 당신의 부드러움을 아는 사람은 오래 곁에 남아요.",
  lore:"납작하고 동그란 몸에 <b>은빛이 도는</b> 생선. 살이 부드럽고 담백해서 처음 회를 먹는 사람도 좋아해요.",
  season:"여름 (6~9월)", mate:"준치", url:"https://ieumfish.co.kr/660294491"},
 {id:"baendaengi", no:"006", name:"밴댕이", shape:"slim", color:"#8FB3C4", v:[1,-1,2,0],
  nick:"누구보다 빨리 알아채는 사람",
  desc:"작은 변화도 금방 느끼는 예민한 안테나를 가졌어요. 그래서 상처도 잘 받지만, 그만큼 다른 사람의 마음을 먼저 알아봅니다. 작지만 맛이 진한 사람.",
  lore:"<b>밴댕이 소갈머리</b>는 속이 작다는 뜻이지만, 밴댕이 회는 기름기가 좔좔 흐르는 진한 맛이에요.",
  season:"봄 (3~5월)", mate:"민어", url:"https://ieumfish.co.kr/52"},
 {id:"anago", no:"007", name:"붕장어", shape:"eel", color:"#8C7A6B", v:[-1,1,-1,1],
  nick:"밤에 빛나는 끈기파",
  desc:"남들이 잠든 시간에 오히려 집중력이 살아나는 사람. 겉으로는 느긋해 보여도 한번 붙잡은 일은 끝까지 놓지 않습니다. 꼬들꼬들, 씹을수록 고소한 타입.",
  lore:"붕장어는 낮에는 모래나 바위 틈에 숨어 있다가 <b>밤에 움직이는</b> 생선이에요.",
  season:"여름 (6~9월)", mate:"웅어", url:"https://ieumfish.co.kr/50"},
 {id:"mineo", no:"008", name:"민어", shape:"fish", color:"#B79C7A", v:[-1,0,-2,-1],
  nick:"버릴 데 없이 다 내어주는 사람",
  desc:"자잘한 것에 연연하지 않고, 필요한 사람에게 아낌없이 내어줍니다. 당신과 함께 있으면 사람들이 든든해져요. 큰 그릇의 사람입니다.",
  lore:"민어는 살, 뱃살, 껍질에 <b>부레까지</b> 귀하게 먹는 생선. 여름 보양식으로 꼽혀 왔어요.",
  season:"여름 (6~9월)", mate:"밴댕이", url:"https://ieumfish.co.kr/22"},
 {id:"jeoneo", no:"009", name:"전어", shape:"fish", color:"#6E9BB0", v:[1,-2,-1,0],

  lore:"<b>전어 굽는 냄새에 집 나간 며느리도 돌아온다</b>는 말, 가을 전어의 매력을 그대로 담은 말이에요.",
  season:"가을 (10~11월)", mate:"참돔", url:"https://ieumfish.co.kr/1206000921"},
 {id:"gwangeo", no:"010", name:"광어", shape:"flat", color:"#9C8F78", v:[-1,-1,-1,-2],
  nick:"누구와도 잘 어울리는 관찰자",
  desc:"튀지 않지만 어느 자리에나 꼭 필요한 사람. 조용히 바닥에 붙어 주변을 살피다가, 필요할 때 정확하게 움직입니다. 기본기가 탄탄한 국민 생선.",
  lore:"광어는 자라면서 <b>두 눈이 한쪽으로 몰리고</b>, 모래 바닥에 몸을 숨기는 생선이에요.",

 {id:"hongeo", no:"011", name:"홍어", shape:"ray", color:"#A78A9A", v:[-2,1,0,2],
  nick:"알수록 빠져드는 확실한 취향",

  lore:"목포 사람에게 홍어는 잔치의 생선. <b>삭힐수록 깊어지는</b> 맛은 시간을 견딘 사람만 압니다.",

 {id:"samchi", no:"012", name:"삼치", shape:"slim", color:"#5F8FA8", v:[2,1,1,-1],

// 공유 주소: GitHub Pages 등 자체 주소에 올리면 그 주소를 자동으로 씁니다.
// 그 밖의 곳(claude.ai 미리보기 등)에서 열면 아래 11탄 주소를 씁니다.
const FALLBACK_URL = "https://hangunada-create.github.io/fishgame/11/";
function baseUrl(){
  try{
    const h=location.hostname;
    if(h && !/claude|anthropic|usercontent/.test(h) && location.protocol.startsWith("http")) return location.origin+location.pathname;
  }catch(e){}
  return FALLBACK_URL;
}

const $=id=>document.getElementById(id);
$("shoal").innerHTML=FISH.map(f=>`<span>${fishImg(f)}</span>`).join("");

let step=0, score=[0,0,0,0];

function show(id){["start","quiz","result","dex"].forEach(s=>$(s).hidden=(s!==id));window.scrollTo({top:0})}

function renderQ(){
  const q=QS[step];
  $("count").textContent=`${step+1} / ${QS.length}`;
  $("barfill").style.width=`${(step/QS.length)*100}%`;
  $("qtext").textContent=q.q;
  $("opts").innerHTML="";
  q.o.forEach(([t,val],i)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="opt"; b.id=`opt-${step}-${i}`; b.textContent=t;
    b.addEventListener("click",()=>{Sound.pick();score[q.axis]+=val;step++;step<QS.length?renderQ():finish()});
    $("opts").appendChild(b);
  });
}

function pick(){
  let best=null,bd=Infinity;
  FISH.forEach(f=>{
    const d=f.v.reduce((s,x,i)=>s+Math.pow(x-score[i],2),0);
    if(d<bd){bd=d;best=f}
  });
  return best;
}

function renderResult(f){
  $("rno").textContent=`No.${f.no}`;
  $("rart").innerHTML=fishImg(f);
  $("rname").textContent=f.name;
  $("rnick").textContent=f.nick;
  $("rdesc").textContent=f.desc;
  $("rlore").innerHTML=f.lore;
  $("rseason").textContent=f.season;
  const m=FISH.find(x=>x.name===f.mate);
  $("rmate").textContent=m?`${m.name} · ${m.nick}`:f.mate;
  $("rbuy").href=f.url;
  $("rbuy").textContent=`${f.name} 맛보러 가기`;
  $("toast").textContent="";
  $("result").dataset.fish=f.id;
  show("result");
}

function finish(){
  setTimeout(()=>Sound.reveal(),120);
  $("barfill").style.width="100%";
  const f=pick();
  try{ if(location.hash!=="#"+f.id) history.replaceState(null,"","#"+f.id) }catch(e){}
  renderResult(f);
}

function start(){$("again").textContent="다시 하기";$("rlabel").textContent="당신과 닮은 생선은";step=0;score=[0,0,0,0];try{history.replaceState(null,"",location.pathname+location.search)}catch(e){};renderQ();show("quiz")}

$("go").addEventListener("click",start);
$("again").addEventListener("click",start);
$("share").addEventListener("click",async()=>{
  const f=FISH.find(x=>x.id===$("result").dataset.fish);
  const url=`${baseUrl()}#${f.id}`;
  const text=`나는 ${f.name}래요. "${f.nick}"\n너는 무슨 생선일까? 이상한 생선가게 생선 테스트\n${url}`;
  if(navigator.share){
    try{await navigator.share({title:"나는 무슨 생선일까?",text:`나는 ${f.name}래요. "${f.nick}"`,url});return}catch(e){if(e&&e.name==="AbortError")return}
  }
  try{await navigator.clipboard.writeText(text);$("toast").textContent="링크까지 복사했어요. 카톡이나 스토리에 붙여 넣으세요."}
  catch(e){$("toast").textContent=text}
});

function openDex(){show("dex")}
$("dexgrid").innerHTML=FISH.map(f=>`<button type="button" class="dexcard" id="dex-${f.id}" data-id="${f.id}"><span class="pic">${fishImg(f)}</span><span class="meta">No.${f.no}</span><b>${f.name}</b><small>${f.nick}</small></button>`).join("");
$("dexgrid").addEventListener("click",e=>{const b=e.target.closest(".dexcard");if(!b)return;Sound.pick();if(Sound.isOn())Sound.startMusic();const f=FISH.find(x=>x.id===b.dataset.id);renderResult(f);$("again").textContent="나도 해보기";$("rlabel").textContent="도감 속 생선";});
$("dexStart").addEventListener("click",openDex);
$("dexRes").addEventListener("click",openDex);
$("dexGo").addEventListener("click",start);


// ── 소리: 파일 없이 브라우저에서 직접 만드는 잔잔한 바닷가 음악과 선택음 ──
const Sound = (()=>{
  let ctx=null, master=null, musicBus=null, sfxBus=null, timer=null, nextT=0, step=0, on=true, started=false;
  try{ if(localStorage.getItem("ieum-sound")==="off") on=false }catch(e){}
  // 다장조 5음계: 바다 위를 천천히 걷는 느낌의 멜로디
  const MEL=[ 0,4,7,9, 7,4,2,4, 0,2,4,7, 9,7,4,null ];
  const CHORDS=[[48,55,64],[45,52,60],[41,48,57],[43,50,59]]; // C, Am, F, G (낮은 화음)
  const midi=n=>440*Math.pow(2,(n-69)/12);
  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=on?1:0; master.connect(ctx.destination);
    musicBus=ctx.createGain(); musicBus.gain.value=0.55;
    const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2200;
    const delay=ctx.createDelay(); delay.delayTime.value=0.42;
    const fb=ctx.createGain(); fb.gain.value=0.33;
    musicBus.connect(lp); lp.connect(master); lp.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(master);
    sfxBus=ctx.createGain(); sfxBus.gain.value=0.9; sfxBus.connect(master);
    waves();
  }
  function note(freq,t,dur,vol,type){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||"triangle"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dur+0.05);
  }
  function waves(){ // 멀리서 들리는 파도 소리
    const len=ctx.sampleRate*4, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type="lowpass"; bp.frequency.value=500;
    const g=ctx.createGain(); g.gain.value=0.0;
    const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=0.09; lg.gain.value=0.025;
    const base=ctx.createConstantSource?ctx.createConstantSource():null;
    lfo.connect(lg); lg.connect(g.gain); if(base){base.offset.value=0.03;base.connect(g.gain);base.start()}
    src.connect(bp); bp.connect(g); g.connect(musicBus); src.start(); lfo.start();
  }
  const BEAT=0.75; // 한 박 0.75초, 아주 느린 걸음
  function schedule(){
    while(nextT<ctx.currentTime+1.2){
      const m=MEL[step%MEL.length];
      if(m!==null){ note(midi(72+m),nextT,2.2,0.06); }
      if(step%8===0){ const ch=CHORDS[(step/8)%CHORDS.length|0]; ch.forEach(n=>note(midi(n),nextT,BEAT*8,0.025,"sine")); }
      nextT+=BEAT; step++;
    }
  }
  function startMusic(){
    init(); if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume();
    if(started) return; started=true;
    nextT=ctx.currentTime+0.1; schedule(); timer=setInterval(schedule,300);
  }
  function blip(f1,f2,t0,dur,vol){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine";
    o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(f2,t0+dur*0.7);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(sfxBus); o.start(t0); o.stop(t0+dur+0.02);
  }
  function pick(){ init(); if(!ctx||!on) return; const t=ctx.currentTime; blip(420,880,t,0.14,0.22); } // 뽀글 물방울
  function reveal(){ init(); if(!ctx||!on) return; const t=ctx.currentTime;
    [72,76,79,84].forEach((n,i)=>blip(midi(n),midi(n)*1.002,t+i*0.11,0.6,0.12)); } // 도감 등록 차임
  function setOn(v){
    on=v; try{localStorage.setItem("ieum-sound",v?"on":"off")}catch(e){}
    const b=$("sound"); b.setAttribute("aria-pressed",String(v)); b.textContent=v?"♪ 소리 켜짐":"♪ 소리 꺼짐";
    if(ctx){ master.gain.setTargetAtTime(v?1:0,ctx.currentTime,0.15) }
    if(v) startMusic();
  }
  return {startMusic,pick,reveal,setOn,isOn:()=>on};
})();
Sound.setOn(Sound.isOn()); // 버튼 표시만 맞춤 (소리는 첫 터치 후에 시작)
$("sound").addEventListener("click",()=>Sound.setOn(!Sound.isOn()));
// 첫 터치에서 음악 시작 (브라우저 정책상 사용자 동작이 있어야 소리가 남)
["go","dexStart","dexGo","again"].forEach(id=>$(id).addEventListener("click",()=>{ if(Sound.isOn()) Sound.startMusic() }));

function route(){
  const id=location.hash.replace("#","");
  const f=FISH.find(x=>x.id===id);
  if(f){renderResult(f);$("again").textContent="나도 해보기";$("rlabel").textContent="친구와 닮은 생선은"}
}
window.addEventListener("hashchange",route);
route();
</script>
